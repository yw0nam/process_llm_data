# Testing Environment Configuration

data:
  input_path: "./tests/fixtures/sample_datasets"
  output_path: "./tests/outputs"
  use_system: true
  dataset_configs: {}

processing:
  process_type: "instruction"
  version: "v1"
  parallel_workers: 1
  batch_size: 10
  sample_size: 50
  validation_size: 10

output:
  output_dir: "./tests/outputs"
  dataset_name: "test_dataset"
  train_split_ratio: 0.7
  val_split_ratio: 0.2
  test_split_ratio: 0.1
  push_to_hub: false
  hub_private: true

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: null
