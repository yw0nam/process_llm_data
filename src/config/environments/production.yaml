# Production Environment Configuration

data:
  input_path: "/data/llm_datasets"
  output_path: "/outputs/prod"
  use_system: true
  dataset_configs: {}

processing:
  process_type: "instruction"
  version: "v2"
  parallel_workers: 8
  batch_size: 1000
  sample_size: null
  validation_size: 5000

output:
  output_dir: "/outputs/prod"
  dataset_name: null
  train_split_ratio: 0.8
  val_split_ratio: 0.1
  test_split_ratio: 0.1
  push_to_hub: false
  hub_private: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "/logs/production.log"
